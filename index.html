<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Valentine Made Just For You
    Click-to-Reveal </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fce4ec;
      color: #880e4f;
    }
    #container {
      margin-top: 50px;
    }
    img {
      max-width: 300px;
      border-radius: 10px;
      margin: 20px 0;
      transition: opacity 0.5s ease;
    }
    #message {
      font-size: 1.2em;
      margin-top: 10px;
    }
    button {
      padding: 10px 20px;
      background: #ad1457;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #d81b60;
    }
  </style>
</head>
<body>
  <h1>💖 Click to Reveal 💖</h1>
  <div id="container">
    <img id="image" src="" alt="Surprise" style="opacity:0;">
    <p id="message"></p>
    <button onclick="showRandom()">Reveal Next</button>
  </div>

  <script>
    const surprises = [
      { image: "images/13.jpeg", message: "I trust in the Lord who put you my way. I pray to Him everyday to keep you well since we arent together now" },
      { image: "images/17.jpeg", message: "This valentine I am not able to take you out but I want you to have this flower🌸" },
      { image: "images/14.jpeg", message: "Sometimes you are a wild flower, one that blooms where there is no love, no care, no nothing just plainness, I want to tame you into my garden flower one that I water and show my love daily😊" },
      { image: "images/2.jpeg", message: "As I am today i didnt want to talk to you, i have my reasons, didnt wakeup in mood, when i put on the data and saw your message, i got a smile this big and a warmth in the heart, I love You😁" },
      { image: "images/3.jpeg", message: "I think this is where it all started and i am greatful for this day" },
      { image: "images/1.jpeg", message: "We are all hard to love you above all people should know that but we are in this together, i respect each decision you set for us" },
      { image: "images/9.jpeg", message: "I thank the good Lord for all, that has happened and i pray we can continue to grow together. I wont lie sometimes you do things that really piss me off, making me rethink my choices and things in life but when i just think of you all that just drifts away🌊" },
      { image: "images/16.jpeg", message: "I dont know what you see whenever you see yourself also i dont care, but when i see you i see so so much, i see my future, my wife, my nalongo, my baby, my valentine and so much more, i will be here for you always❤️." },
      { image: "images/7.jpeg", message: "I will always be your safe space, dont worry you have me by your side night and day 😊💕😍😘DADDY LOVES YOU" }
    ];

    function showRandom() {
      const randomIndex = Math.floor(Math.random() * surprises.length);
      const surprise = surprises[randomIndex];
      
      const img = document.getElementById("image");
      const msg = document.getElementById("message");

      img.style.opacity = 0; // fade out
      setTimeout(() => {
        img.src = surprise.image;
        msg.textContent = surprise.message;
        img.style.opacity = 1; // fade in
      }, 300);
    }
  </script>
</body>
</html>
